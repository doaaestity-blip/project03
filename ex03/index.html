<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event-Driven Web</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="card-container">
        <header class="header-section">
            <span class="badge">Event-Driven Web</span>
            <h1>Interactive Counter Widget</h1>
        </header>

        <main class="display-card">
            <p id="count">0</p>
            <span class="label">Current Value</span>
        </main>

        <footer class="action-buttons">
            <button id="decrement" class="btn btn-dec">
                <span class="icon">&minus;</span> Decrement
            </button>
            <button id="reset" class="btn btn-res">
                <span class="icon">&#x21bb;</span> Reset
            </button>
            <button id="increment" class="btn btn-inc">
                <span class="icon">+</span> Increment
            </button>
        </footer>
    </div>
</body>
</html>
